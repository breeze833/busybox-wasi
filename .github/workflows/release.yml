name: Build and Release busybox-wasi

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen bzip2 make patch

      - name: Set up wasi-sdk
        run: |
          WASI_SDK_VERSION="29.0"
          WASI_SDK_MAJOR="${WASI_SDK_VERSION%%.*}"
          mkdir -p wasi-sdk-tmp
          echo "Downloading wasi-sdk-${WASI_SDK_VERSION}..."
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_MAJOR}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz" | tar -xz -C wasi-sdk-tmp
          mv wasi-sdk-tmp/wasi-sdk-${WASI_SDK_VERSION}* wasi-sdk
          rm -rf wasi-sdk-tmp
          echo "WASI_SDK_PATH=$PWD/wasi-sdk" >> "$GITHUB_ENV"

      - name: Build busybox.wasm
        run: make build

      - name: Run Test Suite
        run: make test

      - name: Package Distribution Archives
        run: make dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: busybox-wasi-dist
          path: |
            bin/busybox.wasm
            bin/cli.js
            dist/busybox-wasi-*.tar.gz
            dist/*.tgz

      - name: Publish Versioned Release (v* Tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "busybox-wasi ${{ github.ref_name }}"
          generate_release_notes: true
          make_latest: "true"
          files: |
            bin/busybox.wasm
            bin/cli.js
            dist/busybox-wasi-*.tar.gz
            dist/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rolling Update 'latest' Git Tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push --force origin refs/tags/latest

      - name: Remove Stale Rolling 'latest' Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true

      - name: Publish Rolling 'latest' Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest (${{ github.ref_name }})"
          body: |
            Rolling release pointing to `${{ github.ref_name }}` (`${{ github.sha }}`).

            ### 📦 Downloadable Assets:
            - **`busybox-wasi-*.tgz`**: Standard npm tarball ready for installation (contains `bin/busybox.wasm`, `bin/cli.js`, and browser-safe `src/host.js`)
            - **`busybox-wasi-*.tar.gz`**: Standalone distribution archive (`bin/busybox.wasm`, `bin/cli.js`, `src/host.js`, `package.json`, `README.md`)
            - **`busybox.wasm`**: Standalone WebAssembly binary targeting WASI Preview 1
            - **`cli.js`**: Standalone Node.js CLI runner
          make_latest: "false"
          files: |
            bin/busybox.wasm
            bin/cli.js
            dist/busybox-wasi-*.tar.gz
            dist/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
